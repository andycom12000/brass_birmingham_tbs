<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Brass Birmingham Snap Map Editor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', sans-serif; background:#1a1a2e; color:#eee; display:flex; height:100vh; overflow:hidden; }

/* Board area */
#board-wrap { flex:1; position:relative; overflow:hidden; }
#board-container {
  position:absolute; top:50%; left:50%;
  transform-origin: center center;
}
#board-img {
  position:absolute;
  opacity:0.80;
  pointer-events:none;
  transform-origin: 0 0;
}
#grid-canvas {
  position:absolute; top:0; left:0;
  pointer-events:none;
}
.marker {
  position:absolute;
  width:22px; height:22px;
  border-radius:50%;
  border:2px solid #fff;
  cursor:grab;
  display:flex; align-items:center; justify-content:center;
  font-size:9px; font-weight:bold; color:#fff;
  text-shadow:0 0 3px #000;
  transform:translate(-50%,-50%);
  z-index:10;
  transition: box-shadow 0.15s;
}
.marker:hover { box-shadow:0 0 8px 2px rgba(255,255,255,0.6); z-index:20; }
.marker.selected { box-shadow:0 0 12px 3px #ffd700; z-index:30; border-color:#ffd700; }
.marker.link-marker {
  width:14px; height:14px;
  border-radius:2px;
  opacity:0.5;
  font-size:7px;
  z-index:5;
  border:1px solid #888;
}
.marker.link-marker:hover { opacity:0.9; }
.marker.unassigned { border-style:dashed; opacity:0.5; }
.marker.swap-pick { animation: pulse 0.6s ease-in-out infinite alternate; }
@keyframes pulse { from { box-shadow:0 0 6px 2px #ff0; } to { box-shadow:0 0 14px 5px #ff0; } }
.city-label {
  position:absolute;
  transform:translate(-50%,-120%);
  font-size:10px;
  color:#ffd700;
  text-shadow:0 0 4px #000, 0 0 4px #000;
  pointer-events:none;
  white-space:nowrap;
  z-index:8;
}

/* Sidebar */
#sidebar {
  width:380px; background:#16213e; border-left:1px solid #333;
  display:flex; flex-direction:column; overflow:hidden;
}
#sidebar h2 { padding:12px 16px; background:#0f3460; font-size:15px; }
#toolbar {
  padding:8px 12px; background:#1a1a3e; display:flex; gap:8px; flex-wrap:wrap;
  border-bottom:1px solid #333;
}
#toolbar button, #toolbar label {
  padding:6px 12px; border:1px solid #555; border-radius:4px;
  background:#2a2a4a; color:#eee; cursor:pointer; font-size:12px;
}
#toolbar button:hover, #toolbar label:hover { background:#3a3a6a; }

#slot-list {
  flex:1; overflow-y:auto; padding:8px;
}
.slot-item {
  padding:8px 10px; margin-bottom:4px;
  border-radius:4px; cursor:pointer;
  border:1px solid transparent;
  font-size:12px;
  display:flex; align-items:center; gap:8px;
}
.slot-item:hover { background:rgba(255,255,255,0.05); }
.slot-item.selected { border-color:#ffd700; background:rgba(255,215,0,0.1); }
.slot-color {
  width:14px; height:14px; border-radius:50%; border:1px solid #888; flex-shrink:0;
}
.slot-info { flex:1; }
.slot-city { font-weight:bold; }
.slot-types { font-size:10px; color:#aaa; }
.slot-pos { font-size:10px; color:#666; }

/* Detail panel */
#detail-panel {
  border-top:1px solid #333; padding:12px; background:#0f3460;
  display:none;
}
#detail-panel h3 { margin-bottom:8px; font-size:14px; color:#ffd700; }
#detail-panel .field { margin-bottom:8px; }
#detail-panel label { font-size:12px; display:block; margin-bottom:2px; color:#aaa; }
#detail-panel select, #detail-panel input[type=text] {
  width:100%; padding:4px 8px; border-radius:3px;
  border:1px solid #555; background:#1a1a3e; color:#eee; font-size:12px;
}
.type-checks { display:flex; flex-wrap:wrap; gap:6px; }
.type-check {
  display:flex; align-items:center; gap:3px;
  padding:3px 8px; border-radius:3px; font-size:11px;
  border:1px solid #555; cursor:pointer;
}
.type-check.active { border-color:#ffd700; background:rgba(255,215,0,0.2); }
.type-check input { display:none; }

/* Zoom controls */
#zoom-info {
  position:fixed; bottom:10px; left:10px; font-size:11px;
  color:#888; z-index:100; background:rgba(0,0,0,0.6); padding:4px 8px; border-radius:3px;
}

/* Export modal */
#export-modal {
  display:none; position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.8); z-index:1000;
  align-items:center; justify-content:center;
}
#export-modal.show { display:flex; }
#export-content {
  background:#16213e; border-radius:8px; padding:20px;
  max-width:800px; width:90%; max-height:80vh; overflow:auto;
}
#export-content h3 { margin-bottom:12px; }
#export-content textarea {
  width:100%; height:400px; background:#0a0a1e; color:#0f0;
  border:1px solid #333; border-radius:4px; padding:10px;
  font-family:monospace; font-size:11px;
}
#export-content button {
  margin-top:10px; padding:8px 20px; border:none; border-radius:4px;
  background:#ffd700; color:#000; font-weight:bold; cursor:pointer;
}

/* Toggle buttons */
.toggle-btn { font-size:11px !important; }
.toggle-btn.active { background:#3a6a3a !important; border-color:#5a5 !important; }

/* Tabs */
.tab-bar { display:flex; border-bottom:1px solid #333; }
.tab-btn { flex:1; padding:8px; text-align:center; cursor:pointer; font-size:12px; border:none; background:#1a1a3e; color:#888; border-bottom:2px solid transparent; transition:all 0.15s; }
.tab-btn.active { color:#ffd700; border-bottom-color:#ffd700; background:#16213e; }
.tab-btn:hover { color:#eee; }

/* Link list */
.link-item { padding:6px 10px; margin-bottom:3px; border-radius:4px; cursor:pointer; border:1px solid transparent; font-size:12px; display:flex; align-items:center; gap:8px; }
.link-item:hover { background:rgba(255,255,255,0.05); }
.link-item.selected { border-color:#ffd700; background:rgba(255,215,0,0.1); }
.link-info { flex:1; }
.link-name { font-weight:bold; }
.link-pos { font-size:10px; color:#666; }
.link-tags { display:flex; gap:3px; margin-top:2px; }
.link-tag { font-size:9px; padding:1px 5px; border-radius:3px; font-weight:bold; }
.link-tag.canal { background:#1565c0; color:#fff; }
.link-tag.rail { background:#c62828; color:#fff; }
.link-tag.market { background:#f9a825; color:#000; }

/* Link marker selected */
.marker.link-marker.selected { opacity:1 !important; box-shadow:0 0 10px 3px #ffd700; border-color:#ffd700 !important; z-index:25; }
.marker.link-marker.has-market { border-color:#f9a825 !important; }
</style>
</head>

<div id="board-wrap">

</div>

    <span id="normal-hint" style="font-size:11px;color:#888">Alt+方向鍵=移動圖片 Alt+/-=縮放 Alt+O=透明度</span>
  </div>
  <div class="tab-bar">

    <div class="tab-btn" data-tab="links">路線 (Links)</div>
  </div>
  <div id="slot-list"></div>
  <div id="link-list" style="display:none;flex:1;overflow-y:auto;padding:8px;"></div>
  <div id="detail-panel">
    <h3 id="detail-title">Slot Detail</h3>
    <div class="field">
      <label>城市 City</label>
      <select id="detail-city"></select>
    </div>
    <div class="field">
      <label>城市內 Slot 編號</label>
      <input type="text" id="detail-slot-num" readonly>
    </div>
    <div class="field">
      <label>產業類型（勾選所有適用的）</label>
      <div class="type-checks" id="detail-types"></div>
    </div>
    <div class="field">
      <label>位置（拖曳地圖上的圓點調整）</label>
      <input type="text" id="detail-pos" readonly>
    </div>
    <div class="field">
      <label>Snap 索引</label>
      <input type="text" id="detail-idx" readonly>
    </div>
  </div>
  <div id="link-detail-panel" style="display:none;border-top:1px solid #333;padding:12px;background:#0f3460;">

      <label>路線 ID</label>

    <div class="field">
      <label>路線屬性（勾選所有適用的）</label>
      <div class="type-checks" id="link-detail-types"></div>
    </div>
    <div class="field">
      <label>位置（拖曳地圖上的方塊調整）</label>

    </div>
    <div class="field">
      <label>Snap 索引</label>
      <input type="text" id="link-detail-idx" readonly style="width:100%;padding:4px 8px;border-radius:3px;border:1px solid #555;background:#1a1a3e;color:#eee;font-size:12px;">
    </div>
  </div>
</div>

<div id="export-modal">
  <div id="export-content">
    <h3>匯出 SnapMap 資料</h3>
    <textarea id="export-text" readonly></textarea>
    <button onclick="copyExport()">複製到剪貼簿</button>
    <button onclick="document.getElementById('export-modal').classList.remove('show')">關閉</button>
  </div>
</div>

const MERCHANT_CITIES = new Set(["Shrewsbury","Gloucester","Oxford","Warrington","Nottingham"]);

// All known cities (longest first for greedy parsing of hyphenated IDs)
const ALL_CITY_NAMES = ["Burton-on-Trent","Stoke-on-Trent","Coalbrookdale","Kidderminster","Wolverhampton","Shrewsbury","Birmingham","Nottingham","Gloucester","Warrington","Nuneaton","Tamworth","Uttoxeter","Stafford","Coventry","Redditch","Worcester","Cannock","Walsall","Dudley","Oxford","Derby","Stone","Belper","Leek"];

function parseLinkCities(id) {
  for (const city of ALL_CITY_NAMES) {
    if (id.startsWith(city + '-')) {
      return [city, id.substring(city.length + 1)];
    }
  }
  return [id, ''];
}

function lookupLinkType(id) {
  if (BOARDDATA_TYPES[id]) return BOARDDATA_TYPES[id];
  const [a, b] = parseLinkCities(id);
  if (a && b) {
    const sorted = [a, b].sort().join('-');
    if (BOARDDATA_TYPES[sorted]) return BOARDDATA_TYPES[sorted];
  }
  return {canal: true, rail: true}; // default for unmatched
}

function isMarketLink(id) {
  const [a, b] = parseLinkCities(id);
  return MERCHANT_CITIES.has(a) || MERCHANT_CITIES.has(b);
}

function worldToScreen(wx, wz) {

  };
}
function screenToWorld(sx, sy) {
  return {
    x: sx / SCALE + WORLD_MIN,
    z: WORLD_MAX - sy / SCALE,
  };
}

// === Board image mapping ===
// The board.jpg is the full table texture (10000x6144).
// The game board area sits inside it. We need to map the image so that
// the game board's TTS world coordinates align with our editor grid.
//
// Known reference points (player board corners visible in image):
//   TTS world (-35.4, 19.1)  ≈ image top-left dark rect
//   TTS world (35.5,  19.1)  ≈ image top-right dark rect
//   TTS world (-35.4,-19.1)  ≈ image bottom-left dark rect
//   TTS world (35.5, -19.1)  ≈ image bottom-right dark rect
//
// We estimate the image covers world X ∈ [-42, 42] and Z ∈ [-25.8, 25.8]
// (maintaining the 10000/6144 aspect ratio: 84/51.6 ≈ 1.628)

const IMG_WORLD_X_MIN = -42;
const IMG_WORLD_X_MAX = 42;
const IMG_WORLD_Z_MIN = -25.8;
const IMG_WORLD_Z_MAX = 25.8;

// Image adjustment state (user can tweak)
let imgOffsetX = 0; // additional pixel shift
let imgOffsetY = 0;
let imgExtraScale = 1.0;
let imgOpacity = 0.80;

function getImgTransform() {
  // Map image so its world coverage aligns with the editor grid.
  // Editor: screenX = (worldX - WORLD_MIN) * SCALE
  // Image:  imgPxX  = (worldX - IMG_WORLD_X_MIN) / (IMG_WORLD_X_MAX - IMG_WORLD_X_MIN) * imgNaturalW

  const imgW = 10000, imgH = 6144;
  const imgWorldW = IMG_WORLD_X_MAX - IMG_WORLD_X_MIN; // 84
  const imgWorldH = IMG_WORLD_Z_MAX - IMG_WORLD_Z_MIN; // 51.6

  // Pixels per world unit in image
  const imgPxPerUnit = imgW / imgWorldW; // ~119

  // Pixels per world unit in editor
  const edPxPerUnit = SCALE; // 900/34 ≈ 26.47

  // Display scale: editor pixels / image pixels
  const displayScale = edPxPerUnit / imgPxPerUnit * imgExtraScale;

  // Display size
  const displayW = imgW * displayScale;
  const displayH = imgH * displayScale;

  // Position: the image world origin (IMG_WORLD_X_MIN, IMG_WORLD_Z_MAX) maps to
  // editor pixel (screenX, screenY) where:
  //   screenX = (IMG_WORLD_X_MIN - WORLD_MIN) * SCALE
  //   screenY = (WORLD_MAX - IMG_WORLD_Z_MAX) * SCALE
  const left = (IMG_WORLD_X_MIN - WORLD_MIN) * SCALE + imgOffsetX;
  const top  = (WORLD_MAX - IMG_WORLD_Z_MAX) * SCALE + imgOffsetY;

  return { left, top, displayW, displayH, displayScale };
}

function applyImgTransform() {
  const t = getImgTransform();
  boardImg.style.left = t.left + 'px';
  boardImg.style.top  = t.top + 'px';
  boardImg.style.width = t.displayW + 'px';
  boardImg.style.height = t.displayH + 'px';
  boardImg.style.opacity = imgOpacity;
}

function init() {
  boardContainer.style.width = BOARD_PX + 'px';
  boardContainer.style.height = BOARD_PX + 'px';
  boardContainer.style.marginLeft = -BOARD_PX/2 + 'px';
  boardContainer.style.marginTop = -BOARD_PX/2 + 'px';
  gridCanvas.width = BOARD_PX;
  gridCanvas.height = BOARD_PX;

  // Auto-load board image from same directory
  boardImg.src = 'board.jpg';
  boardImg.onload = () => {

function updateTransform() {
  boardContainer.style.transform = `translate(-50%,-50%) translate(${panX}px,${panY}px) scale(${zoom})`;
}

function drawGrid() {
  const ctx = gridCanvas.getContext('2d');
  ctx.clearRect(0,0,BOARD_PX,BOARD_PX);
  if (!showGrid) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 1;
  for (let w = -16; w <= 16; w += 2) {
    const p = worldToScreen(w, 0);
    ctx.beginPath(); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, BOARD_PX); ctx.stroke();
    const p2 = worldToScreen(0, w);
    ctx.beginPath(); ctx.moveTo(0, p2.y); ctx.lineTo(BOARD_PX, p2.y); ctx.stroke();
  }
  // Axes
  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  const o = worldToScreen(0,0);
  ctx.beginPath(); ctx.moveTo(o.x,0); ctx.lineTo(o.x,BOARD_PX); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0,o.y); ctx.lineTo(BOARD_PX,o.y); ctx.stroke();
  // Labels
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.font = '10px monospace';
  for (let w = -16; w <= 16; w += 4) {
    const px = worldToScreen(w, 0);
    ctx.fillText(w.toString(), px.x+2, o.y-3);
    const pz = worldToScreen(0, w);
    ctx.fillText(w.toString(), o.x+3, pz.y-2);
  }
}

let dragging = null;
let dragOffsetX = 0, dragOffsetY = 0;
let dragStartTime = 0;

function onMarkerMouseDown(e) {
  e.stopPropagation();
  const idx = parseInt(e.target.dataset.slotIdx);
  if (isNaN(idx)) return;
  dragging = { el: e.target, idx };
  dragStartTime = Date.now();
  const rect = boardContainer.getBoundingClientRect();
  const currentLeft = parseFloat(e.target.style.left);
  const currentTop = parseFloat(e.target.style.top);
  dragOffsetX = e.clientX - (rect.left + currentLeft * zoom);
  dragOffsetY = e.clientY - (rect.top + currentTop * zoom);
  e.target.style.cursor = 'grabbing';
}

document.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const rect = boardContainer.getBoundingClientRect();
  const sx = (e.clientX - dragOffsetX - rect.left) / zoom;
  const sy = (e.clientY - dragOffsetY - rect.top) / zoom;
  dragging.el.style.left = sx + 'px';
  dragging.el.style.top = sy + 'px';
  // Update world coords
  const w = screenToWorld(sx, sy);
  const slot = slots[dragging.idx];
  if (slot) {
    slot.x = Math.round(w.x * 1000) / 1000;
    slot.z = Math.round(w.z * 1000) / 1000;
    document.getElementById('detail-pos').value = `(${slot.x.toFixed(3)}, ${slot.z.toFixed(3)})`;
  }
});

document.addEventListener('mouseup', (e) => {
  if (!dragging) return;
  dragging.el.style.cursor = 'grab';
  const elapsed = Date.now() - dragStartTime;
  if (elapsed < 200) {
    // Click: select
    selectSlot(dragging.idx);
  } else {
    // Drag completed: update sidebar
    updateSlotListItem(dragging.idx);
  }
  dragging = null;
});

function swapCities(cityA, cityB) {
  if (cityA === cityB) return;
  // Swap city names, slotNums, types, and IDs between the two city groups
  const slotsA = slots.filter(s => s.city === cityA);
  const slotsB = slots.filter(s => s.city === cityB);
  // Swap city name
  slotsA.forEach(s => { s.city = cityB; });
  slotsB.forEach(s => { s.city = cityA; });
  // Renumber all affected slots
  [...slotsA, ...slotsB].forEach(s => {
    const sameCity = slots.filter(ss => ss.city === s.city);
    s.slotNum = sameCity.indexOf(s) + 1;
    s.id = `${s.city}_${s.slotNum}`;
  });
  // Also swap the types arrays: each position keeps its NEW city's type definitions
  // Actually NO — the user wants to swap which city NAME is assigned to which POSITION cluster.
  // The types should follow the city name (since types are defined per city in BoardData).
  // So we DON'T swap types — we swap city+types together.
  // But wait, the point is: the positions are correct, the city labels are wrong.
  // So we just need to swap city names. The types are already correct for each city in BoardData.
  // We need to swap types along with city names.
  // slotsA now has cityB name, but they still have cityA's types → need to swap types too.

  // Actually the simplest: swap the city, slotNum, id, AND types.
  // We swap ALL metadata between the two groups, keeping only positions.

  // Reset: undo what we just did
  slotsA.forEach(s => { s.city = cityA; });
  slotsB.forEach(s => { s.city = cityB; });

  // Collect metadata
  const metaA = slotsA.map(s => ({ city: s.city, slotNum: s.slotNum, id: s.id, types: [...s.types] }));
  const metaB = slotsB.map(s => ({ city: s.city, slotNum: s.slotNum, id: s.id, types: [...s.types] }));

  // Apply B's metadata to A's positions, and vice versa
  // Only works if both have the same slot count
  if (slotsA.length === slotsB.length) {
    for (let i = 0; i < slotsA.length; i++) {
      slotsA[i].city = metaB[i].city;
      slotsA[i].slotNum = metaB[i].slotNum;
      slotsA[i].id = metaB[i].id;
      slotsA[i].types = metaB[i].types;
    }
    for (let i = 0; i < slotsB.length; i++) {
      slotsB[i].city = metaA[i].city;
      slotsB[i].slotNum = metaA[i].slotNum;
      slotsB[i].id = metaA[i].id;
      slotsB[i].types = metaA[i].types;
    }
  } else {
    // Different slot counts: just swap city names, renumber
    slotsA.forEach(s => { s.city = cityB; });
    slotsB.forEach(s => { s.city = cityA; });
    slots.filter(s => s.city === cityA || s.city === cityB).forEach(s => {
      const sameCity = slots.filter(ss => ss.city === s.city);
      s.slotNum = sameCity.indexOf(s) + 1;
      s.id = `${s.city}_${s.slotNum}`;
    });
  }

  renderMarkers();
  renderSlotList();
}

function selectSlot(idx) {
  // Handle swap mode
  if (swapMode) {
    const clickedCity = slots[idx].city;
    if (!swapFirstCity) {
      swapFirstCity = clickedCity;
      document.getElementById('swap-hint').textContent =
        `已選 ${cityDisplay(clickedCity)}，再點另一個城市的格子完成互換（Esc取消）`;
      renderMarkers(); // highlight first city
      return;
    } else {
      if (clickedCity !== swapFirstCity) {
        const nameA = cityDisplay(swapFirstCity);
        const nameB = cityDisplay(clickedCity);
        swapCities(swapFirstCity, clickedCity);
        document.getElementById('swap-hint').textContent = `已互換 ${nameA} ↔ ${nameB}！可繼續互換或按按鈕結束`;
      }
      swapFirstCity = null;
      renderMarkers();
      return;
    }
  }

  // Deselect link
  selectedLinkIdx = -1;
  document.getElementById('link-detail-panel').style.display = 'none';
  linkMarkerEls.forEach(el => el.classList.remove('selected'));
  document.querySelectorAll('#link-list .link-item').forEach(el => el.classList.remove('selected'));

  selectedSlotIdx = idx;
  const s = slots[idx];

  // Update markers
  markerEls.forEach((el,i) => {
    if (i < slots.length) el.classList.toggle('selected', i === idx);
  });

  // Update list
  slotList.querySelectorAll('.slot-item').forEach((el,i) => {
    el.classList.toggle('selected', i === idx);
  });

  // Scroll into view
  const listItem = slotList.querySelectorAll('.slot-item')[idx];
  if (listItem) listItem.scrollIntoView({block:'nearest'});

  // Show detail panel
  detailPanel.style.display = 'block';
  document.getElementById('detail-title').textContent = s.id;

  // City dropdown
  const citySelect = document.getElementById('detail-city');
  citySelect.innerHTML = '';
  Object.keys(CITY_COLORS).sort().forEach(c => {
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = cityDisplay(c);
    if (c === s.city) opt.selected = true;
    citySelect.appendChild(opt);
  });
  citySelect.onchange = () => {
    s.city = citySelect.value;
    // Renumber
    const sameCity = slots.filter(ss => ss.city === s.city);
    s.slotNum = sameCity.indexOf(s) + 1;
    s.id = `${s.city}_${s.slotNum}`;
    document.getElementById('detail-slot-num').value = s.slotNum;
    document.getElementById('detail-title').textContent = s.id;
    updateSlotListItem(idx);
    renderMarkers();
  };

  document.getElementById('detail-slot-num').value = s.slotNum;
  document.getElementById('detail-pos').value = `(${s.x.toFixed(3)}, ${s.z.toFixed(3)})`;
  document.getElementById('detail-idx').value = s.snapIdx;

  // Type checkboxes
  const typesDiv = document.getElementById('detail-types');
  typesDiv.innerHTML = '';
  INDUSTRY_TYPES.forEach(t => {
    const active = s.types.includes(t);
    const label = document.createElement('label');
    label.className = 'type-check' + (active ? ' active' : '');
    label.style.borderColor = active ? TYPE_COLORS[t] : '#555';
    label.innerHTML = `<input type="checkbox" value="${t}" ${active?'checked':''}>${TYPE_LABELS[t]}`;
    label.querySelector('input').addEventListener('change', (e) => {
      if (e.target.checked) {
        if (!s.types.includes(t)) s.types.push(t);
      } else {
        s.types = s.types.filter(tt => tt !== t);
      }
      label.className = 'type-check' + (e.target.checked ? ' active' : '');
      label.style.borderColor = e.target.checked ? TYPE_COLORS[t] : '#555';
      updateSlotListItem(idx);
      renderMarkers();
    });
    typesDiv.appendChild(label);
  });
}

// ============================================================
// LINK MARKERS – drag & click
// ============================================================
let draggingLink = null;
let linkDragStartTime = 0;

function onLinkMarkerMouseDown(e) {
  e.stopPropagation();
  const li = parseInt(e.target.dataset.linkIdx);
  if (isNaN(li)) return;
  draggingLink = { el: e.target, idx: li };
  linkDragStartTime = Date.now();
  const rect = boardContainer.getBoundingClientRect();
  const currentLeft = parseFloat(e.target.style.left);
  const currentTop = parseFloat(e.target.style.top);
  draggingLink.offX = e.clientX - (rect.left + currentLeft * zoom);
  draggingLink.offY = e.clientY - (rect.top + currentTop * zoom);
  e.target.style.cursor = 'grabbing';
}

document.addEventListener('mousemove', (e) => {
  if (!draggingLink) return;
  const rect = boardContainer.getBoundingClientRect();
  const sx = (e.clientX - draggingLink.offX - rect.left) / zoom;
  const sy = (e.clientY - draggingLink.offY - rect.top) / zoom;
  draggingLink.el.style.left = sx + 'px';
  draggingLink.el.style.top = sy + 'px';
  const w = screenToWorld(sx, sy);
  const lnk = links[draggingLink.idx];
  if (lnk) {
    lnk.x = Math.round(w.x * 1000) / 1000;
    lnk.z = Math.round(w.z * 1000) / 1000;
    const posField = document.getElementById('link-detail-pos');
    if (posField) posField.value = `(${lnk.x.toFixed(3)}, ${lnk.z.toFixed(3)})`;
  }
});

document.addEventListener('mouseup', (e) => {
  if (!draggingLink) return;
  draggingLink.el.style.cursor = 'grab';
  const elapsed = Date.now() - linkDragStartTime;
  if (elapsed < 200) {
    selectLink(draggingLink.idx);
  } else {
    updateLinkListItem(draggingLink.idx);
  }
  draggingLink = null;
});

// ============================================================
// LINK LIST (sidebar)
// ============================================================
const linkList = document.getElementById('link-list');

function renderLinkList() {
  linkList.innerHTML = '';
  links.forEach((lnk, i) => {
    const el = document.createElement('div');
    el.className = 'link-item' + (i === selectedLinkIdx ? ' selected' : '');
    el.dataset.linkIdx = i;
    const tags = [];
    if (lnk.canal) tags.push('<span class="link-tag canal">運船</span>');
    if (lnk.rail) tags.push('<span class="link-tag rail">火車</span>');
    if (lnk.market) tags.push('<span class="link-tag market">市場</span>');
    el.innerHTML = `
      <div class="link-info">
        <div class="link-name">${lnk.id}</div>
        <div class="link-tags">${tags.join('')}</div>
        <div class="link-pos">snap[${lnk.snapIdx}] (${lnk.x.toFixed(3)}, ${lnk.z.toFixed(3)})</div>
      </div>`;
    el.addEventListener('click', () => selectLink(i));
    linkList.appendChild(el);
  });
}

function updateLinkListItem(idx) {
  const items = linkList.querySelectorAll('.link-item');
  if (items[idx]) {
    const lnk = links[idx];
    const tags = [];
    if (lnk.canal) tags.push('<span class="link-tag canal">運船</span>');
    if (lnk.rail) tags.push('<span class="link-tag rail">火車</span>');
    if (lnk.market) tags.push('<span class="link-tag market">市場</span>');
    items[idx].querySelector('.link-name').textContent = lnk.id;
    items[idx].querySelector('.link-tags').innerHTML = tags.join('');
    items[idx].querySelector('.link-pos').textContent = `snap[${lnk.snapIdx}] (${lnk.x.toFixed(3)}, ${lnk.z.toFixed(3)})`;
  }
}

// ============================================================
// LINK DETAIL PANEL
// ============================================================
const LINK_PROP_DEFS = [
  { key:'canal',  label:'運船 (Canal)',  color:'#1565c0' },
  { key:'rail',   label:'火車 (Rail)',   color:'#c62828' },
  { key:'market', label:'市場連結 (Market)', color:'#f9a825' },
];

function selectLink(idx) {
  // Deselect slot
  selectedSlotIdx = -1;
  detailPanel.style.display = 'none';
  markerEls.forEach(el => el.classList.remove('selected'));
  slotList.querySelectorAll('.slot-item').forEach(el => el.classList.remove('selected'));

  selectedLinkIdx = idx;
  const lnk = links[idx];

  // Update link markers
  linkMarkerEls.forEach((el, i) => el.classList.toggle('selected', i === idx));

  // Update link list
  linkList.querySelectorAll('.link-item').forEach((el, i) => el.classList.toggle('selected', i === idx));

  // Scroll into view
  const listItem = linkList.querySelectorAll('.link-item')[idx];
  if (listItem) listItem.scrollIntoView({block:'nearest'});

  // Switch to links tab if not active
  if (activeTab !== 'links') {
    switchTab('links');
  }

  // Show link detail panel
  const panel = document.getElementById('link-detail-panel');
  panel.style.display = 'block';
  document.getElementById('link-detail-title').textContent = lnk.id;
  document.getElementById('link-detail-id').value = lnk.id;
  document.getElementById('link-detail-pos').value = `(${lnk.x.toFixed(3)}, ${lnk.z.toFixed(3)})`;
  document.getElementById('link-detail-idx').value = lnk.snapIdx;

  // Type checkboxes
  const typesDiv = document.getElementById('link-detail-types');
  typesDiv.innerHTML = '';
  LINK_PROP_DEFS.forEach(def => {
    const active = lnk[def.key];
    const label = document.createElement('label');
    label.className = 'type-check' + (active ? ' active' : '');
    label.style.borderColor = active ? def.color : '#555';
    label.innerHTML = `<input type="checkbox" value="${def.key}" ${active?'checked':''}>${def.label}`;
    label.querySelector('input').addEventListener('change', (e) => {
      lnk[def.key] = e.target.checked;
      label.className = 'type-check' + (e.target.checked ? ' active' : '');
      label.style.borderColor = e.target.checked ? def.color : '#555';
      updateLinkListItem(idx);
      renderMarkers();
    });
    typesDiv.appendChild(label);
  });
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  slotList.style.display = tab === 'slots' ? '' : 'none';
  linkList.style.display = tab === 'links' ? '' : 'none';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

// ============================================================
// PAN & ZOOM
// ============================================================
let isPanning = false;
let panStartX, panStartY;

document.getElementById('board-wrap').addEventListener('mousedown', (e) => {
  if (e.target.classList.contains('marker')) return;
  isPanning = true;
  panStartX = e.clientX - panX;
  panStartY = e.clientY - panY;
});

document.addEventListener('mousemove', (e) => {
  if (!isPanning) return;
  panX = e.clientX - panStartX;
  panY = e.clientY - panStartY;
  updateTransform();
});

document.addEventListener('mouseup', () => { isPanning = false; });

document.getElementById('board-wrap').addEventListener('wheel', (e) => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.max(0.3, Math.min(5, zoom * delta));
  updateTransform();
}, {passive:false});

// SWAP MODE

document.getElementById('btn-swap').addEventListener('click', (e) => {

  swapFirstCity = null;
  e.target.classList.toggle('active', swapMode);
  e.target.style.background = swapMode ? '#c33' : '#8b2500';
  document.getElementById('swap-hint').style.display = swapMode ? 'inline' : 'none';
  document.getElementById('normal-hint').style.display = swapMode ? 'none' : 'inline';

    document.getElementById('swap-hint').textContent = '點擊第一個城市的格子，再點第二個城市的格子即完成互換';
  }
  renderMarkers();
});

// Esc to cancel swap
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && swapMode) {
    swapFirstCity = null;
    document.getElementById('swap-hint').textContent = '點擊第一個城市的格子，再點第二個城市的格子即完成互換';
    renderMarkers();
  }
});

// Image position adjustment via keyboard (Alt+Arrow=move, Alt+/-=scale, Alt+O=opacity)
document.addEventListener('keydown', (e) => {
  if (!boardImg.src) return;
  const step = e.shiftKey ? 5 : 1;
  let changed = false;
  if (e.key === 'ArrowLeft'  && e.altKey) { imgOffsetX -= step; changed = true; }
  if (e.key === 'ArrowRight' && e.altKey) { imgOffsetX += step; changed = true; }
  if (e.key === 'ArrowUp'   && e.altKey) { imgOffsetY -= step; changed = true; }
  if (e.key === 'ArrowDown' && e.altKey) { imgOffsetY += step; changed = true; }
  if ((e.key === '+' || e.key === '=') && e.altKey) { imgExtraScale *= 1.01; changed = true; }
  if (e.key === '-' && e.altKey) { imgExtraScale /= 1.01; changed = true; }
  if (e.key === 'o' && e.altKey) {
    imgOpacity = imgOpacity > 0.5 ? 0.3 : 0.8;
    changed = true;
  }
  if (changed) {
    e.preventDefault();
    applyImgTransform();
  }
});

// ============================================================
// EXPORT
// ============================================================
document.getElementById('btn-export').addEventListener('click', () => {
  const lines = [];
  lines.push('    -- Hardcoded: snap point world position -> BoardData slot ID');
  lines.push('    -- Generated by snap_editor.html');
  lines.push('    local SLOT_POSITIONS = {');

  // Group by city
  const byCity = {};
  slots.forEach(s => {
    if (!byCity[s.city]) byCity[s.city] = [];
    byCity[s.city].push(s);
  });

  for (const city of Object.keys(byCity).sort()) {
    const citySlots = byCity[city];
    citySlots.sort((a,b) => a.slotNum - b.slotNum);
    lines.push(`        -- ${city} (${citySlots.length} slots)`);
    citySlots.forEach(s => {
      lines.push(`        { id = "${s.id}", pos = Vector(${s.x.toFixed(3)}, 0.96, ${s.z.toFixed(3)}) },`);
    });
  }
  lines.push('    }');

  lines.push('');
  lines.push('-- BoardData slot types update:');
  for (const city of Object.keys(byCity).sort()) {
    const citySlots = byCity[city];
    citySlots.sort((a,b) => a.slotNum - b.slotNum);
    lines.push(`    ${city.includes('-') ? '["'+city+'"]' : city} = {`);
    lines.push('        slots = {');
    citySlots.forEach(s => {
      const typesStr = s.types.map(t => {
        const map = {cotton:'I.COTTON',coal:'I.COAL',iron:'I.IRON',brewery:'I.BREWERY',manufacturer:'I.MANUFACTURER',pottery:'I.POTTERY'};
        return map[t] || t;
      }).join(', ');
      lines.push(`            { id = "${s.id}", types = {${typesStr}} },`);
    });
    lines.push('        }');
    lines.push('    },');
  }

  // Link positions and types
  lines.push('');
  lines.push('    -- Link snap positions and types');
  lines.push('    -- Generated by snap_editor.html');
  lines.push('    local LINK_POSITIONS = {');
  links.forEach(lnk => {
    const types = [];
    if (lnk.canal) types.push('E.CANAL');
    if (lnk.rail) types.push('E.RAIL');
    const typesStr = types.join(', ');
    const marketStr = lnk.market ? ', market = true' : '';
    lines.push(`        { id = "${lnk.id}", pos = Vector(${lnk.x.toFixed(3)}, 0.96, ${lnk.z.toFixed(3)}), types = {${typesStr}}${marketStr} },`);
  });
  lines.push('    }');

  lines.push('');
  lines.push('-- BoardData links update:');
  links.forEach(lnk => {
    const [a, b] = parseLinkCities(lnk.id);
    const sorted = [a, b].sort();
    const key = sorted.join('-');
    const types = [];
    if (lnk.canal) types.push('E.CANAL');
    if (lnk.rail) types.push('E.RAIL');
    lines.push(`    ["${key}"] = { cities = { "${sorted[0]}", "${sorted[1]}" }, types = { ${types.join(', ')} } },`);
  });

  document.getElementById('export-text').value = lines.join('\n');
  document.getElementById('export-modal').classList.add('show');
});

function copyExport() {
  const ta = document.getElementById('export-text');
  ta.select();
  document.execCommand('copy');
  alert('Copied!');
}
